<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>モノ差す２お品書き作成お助けツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111;
    --paper: #f3f1ec;
    --card: #fff;
    --line: #1a1a1a;
    --accent: #ff8a2b;
    --muted: #666;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.6;
  }
  header.top {
    background: #000;
    color: #fff;
    padding: 18px 20px 14px;
    text-align: center;
    position: relative;
  }
  header.top h1 { margin: 0; font-size: clamp(18px, 4.5vw, 26px); letter-spacing: .12em; }
  header.top p { margin: 4px 0 0; font-size: 12px; color: #bbb; letter-spacing: .08em; }
  header.top::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
    background: linear-gradient(90deg, #e33, #f90, #fd0, #3b5, #3ad, #66f, #b4c);
  }
  main {
    max-width: 1100px; margin: 0 auto; padding: 20px 14px 10px;
    display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 22px; align-items: start;
  }
  .preview { position: sticky; top: 12px; }
  .stage { width: min(100%, 43vh); margin: 0 auto; background: #000; border: 2px solid #000; box-shadow: 6px 6px 0 rgba(0,0,0,.2); }
  .stage canvas { display: block; width: 100%; height: auto; touch-action: auto; }
  .preview .note { font-size: 12px; color: var(--muted); text-align: center; margin: 8px 0 0; }
  .panel { display: flex; flex-direction: column; gap: 14px; }
  section.card {
    background: var(--card); border: 2px solid var(--line); padding: 12px 14px 14px; position: relative;
  }
  section.card > h2 {
    margin: -12px -14px 12px; padding: 5px 14px; background: #000; color: #fff;
    font-size: 14px; letter-spacing: .1em; font-weight: 700;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 6px 0; }
  label.fl { font-size: 13px; font-weight: 700; display: block; margin-bottom: 3px; }
  input[type=text], select, textarea {
    font: inherit; font-size: 15px; padding: 6px 8px; border: 1.5px solid #333; border-radius: 0; background: #fff; color: #111;
  }
  input[type=text] { width: 100%; }
  textarea { width: 100%; min-height: 120px; resize: vertical; }
  .chk { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; cursor: pointer; }
  .chk input { width: 17px; height: 17px; accent-color: #000; }
  button {
    font: inherit; font-size: 14px; font-weight: 700; padding: 8px 14px; border: 2px solid #000; background: #fff; color: #000; cursor: pointer;
  }
  button:hover { background: #000; color: #fff; }
  button.primary { background: var(--accent); width: 100%; padding: 12px; font-size: 16px; }
  button.primary:hover { background: #000; color: var(--accent); }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatches label { cursor: pointer; }
  .swatches input { position: absolute; opacity: 0; pointer-events: none; }
  .swatches span {
    display: flex; align-items: center; gap: 5px; padding: 3px 9px 3px 4px; border: 2px solid transparent; font-size: 13px;
  }
  .swatches i { width: 20px; height: 20px; border: 1px solid #000; display: block; }
  .swatches input:checked + span { border-color: #000; background: #eee; font-weight: 700; }
  .hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  .time { display: inline-flex; align-items: center; gap: 3px; }
  footer {
    max-width: 1100px; margin: 18px auto 0; padding: 18px 14px 28px; text-align: center; font-size: 12px; color: var(--muted);
    border-top: 1px solid #bbb;
  }
  footer a { color: #333; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    .preview { position: static; }
    .stage { width: min(100%, 460px); }
  }
</style>
</head>
<body>
<header class="top">
  <h1>モノ差す２お品書き作成お助けツール</h1>
  <p>日車寛見ウェブオンリー「モノクロームに、差す色は２」</p>
</header>

<main>
  <div class="preview">
    <div class="stage"><canvas id="cv" width="1000" height="2000"></canvas></div>
    <p class="note">プレビュー（サークルカット画像はドラッグで移動、四隅のハンドルで拡大縮小）</p>
  </div>

  <div class="panel">
    <section class="card">
      <h2>全体設定</h2>
      <label class="fl">フォント</label>
      <div class="row">
        <label class="chk"><input type="radio" name="font" value="gothic" checked> ゴシック</label>
        <label class="chk"><input type="radio" name="font" value="mincho"> 明朝</label>
      </div>
      <label class="fl" style="margin-top:10px">チェック箇所に重ねる色</label>
      <div class="swatches" id="swatches"></div>
    </section>

    <section class="card">
      <h2>サークルカット</h2>
      <div class="row">
        <input type="file" id="file" accept="image/*">
      </div>
      <div class="row">
        <button type="button" id="btnFit">フィットに戻す</button>
        <button type="button" id="btnClear">画像を削除</button>
      </div>
      <p class="hint">取り込み時は枠内に収まるようフィットします。画像のドラッグで移動、四隅のハンドルで拡大縮小できます（ハンドルは書き出し画像には入りません）。</p>
    </section>

    <section class="card">
      <h2>サークル情報</h2>
      <label class="fl" for="circleName">サークル名</label>
      <input type="text" id="circleName" maxlength="60">
      <label class="fl" for="hn" style="margin-top:10px">HN</label>
      <input type="text" id="hn" maxlength="60">
      <label class="fl" style="margin-top:10px">スペース番号</label>
      <div class="row">
        <span>AREA <select id="area"><option value="">--</option><option>1</option><option>2</option><option>3</option><option>4</option></select></span>
        <span><select id="kana"></select> <select id="num"></select></span>
      </div>
      <p class="hint">「あ」行および空きスペースは選べません。</p>
    </section>

    <section class="card">
      <h2>当日滞在予定</h2>
      <div class="row">
        <label class="chk"><input type="checkbox" id="stayOn"> 滞在</label>
        <span class="time">
          <select id="sh"></select>:<select id="sm"></select>
        </span>
        ～
        <span class="time">
          <select id="eh"></select>:<select id="em"></select>
        </span>
      </div>
      <div class="row">
        <label class="chk"><input type="checkbox" id="absent"> 不在</label>
        <label class="chk"><input type="checkbox" id="unknown"> 不明</label>
      </div>
    </section>

    <section class="card">
      <h2>その他の項目</h2>
      <div class="row">
        <span><label class="fl">R18の有無</label>
          <select id="r18"><option value="">未選択</option><option value="yes">有り</option><option value="no">無し</option></select></span>
        <span><label class="fl">自店舗撮影</label>
          <select id="shoot"><option value="">未選択</option><option value="ok">可</option><option value="ng">不可</option></select></span>
        <span><label class="fl">アニメ勢へのネタバレ</label>
          <select id="spoil"><option value="">未選択</option><option value="yes">有り</option><option value="no">無し</option></select></span>
      </div>
      <label class="fl" style="margin-top:10px">出展内容</label>
      <div class="row">
        <label class="chk"><input type="checkbox" class="content" value="tsuhan"> 通販</label>
        <label class="chk"><input type="checkbox" class="content" value="tenji"> 展示</label>
        <label class="chk"><input type="checkbox" class="content" value="neppuri"> ネップリ</label>
        <label class="chk"><input type="checkbox" class="content" value="illust"> イラスト</label>
        <label class="chk"><input type="checkbox" class="content" value="manga"> 漫画</label>
        <label class="chk"><input type="checkbox" class="content" value="novel"> 小説</label>
        <label class="chk"><input type="checkbox" class="content" value="other" id="otherOn"> その他</label>
      </div>
      <input type="text" id="otherText" placeholder="その他の内容（「その他」をチェックすると反映）" maxlength="40">
      <label class="fl" for="cp" style="margin-top:10px">CPなど</label>
      <input type="text" id="cp" maxlength="80">
    </section>

    <section class="card">
      <h2>フリースペース</h2>
      <textarea id="free" placeholder="自由に入力（改行可）"></textarea>
      <div class="row">
        <span><label class="fl" for="fsize">フォントサイズ</label>
          <select id="fsize">
            <option>20</option><option>24</option><option>28</option><option selected>32</option><option>36</option><option>40</option><option>48</option><option>56</option>
          </select></span>
        <span><label class="fl" for="fcolor">フォントカラー</label>
          <input type="color" id="fcolor" value="#111111"></span>
      </div>
    </section>

    <button type="button" class="primary" id="btnSave">画像をダウンロード(PNG)</button>
  </div>
</main>

<footer>モノ差す２お品書き作成お助けツール　｜　<a href="https://kanashiki1979.github.io/terms/" target="_blank" rel="noopener">制作・イベント支援ツール</a>　｜　<a href="https://github.com/kanashiki1979/terms" target="_blank" rel="noopener">利用規約・免責事項</a></footer>

      const i = new Image();
      i.onload = () => { img = i; fitImage(); render(); };
      i.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
  $("btnFit").addEventListener("click", () => { fitImage(); render(); });
  $("btnClear").addEventListener("click", () => { img = null; $("file").value = ""; render(); });

  /* ---------- 描画ヘルパー ---------- */
  function fontFamily() {
    return (document.querySelector("input[name=font]:checked").value === "mincho"
      ? '"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif'
      : '"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif');
  }
  function fnt(size, weight) { return (weight || 700) + " " + size + "px " + fontFamily(); }

  function fitText(text, x, y, maxW, maxSize, align, weight) {
    if (!text) return;
    ctx.textBaseline = "middle";
    ctx.textAlign = align || "left";
    let size = maxSize;
    ctx.font = fnt(size, weight);
    const w = ctx.measureText(text).width;
    if (w > maxW) { size = Math.max(6, size * maxW / w); ctx.font = fnt(size, weight); }
    ctx.fillText(text, x, y);
  }

  function tint(r) {
    ctx.save();
    ctx.globalCompositeOperation = "multiply";
    ctx.globalAlpha = ALPHA;
    ctx.fillStyle = compensated(targetColor);
    ctx.fillRect(r[0], r[1], r[2], r[3]);
    ctx.restore();
  }

  function drawCutContent(c, ox, oy) {
    // 枠内の合成結果を c に描く（ox,oy は枠左上の座標系オフセット）
    c.save();
    c.beginPath(); c.rect(CUT.x - ox, CUT.y - oy, CUT.w, CUT.h); c.clip();
    c.fillStyle = "#fff"; c.fillRect(CUT.x - ox, CUT.y - oy, CUT.w, CUT.h);
    if (img) {
      const w = img.naturalWidth * im.s, h = img.naturalHeight * im.s;
      c.imageSmoothingQuality = "high";
      c.drawImage(img, im.cx - w / 2 - ox, im.cy - h / 2 - oy, w, h);
    }
    c.restore();
  }

  function downscale(src, tw, th) {
    // 段階的に縮小して画質を保つ
    let cur = src;
    while (cur.width / 2 > tw) {
      const t = document.createElement("canvas");
      t.width = Math.round(cur.width / 2); t.height = Math.round(cur.height / 2);
      const tc = t.getContext("2d"); tc.imageSmoothingQuality = "high";
      tc.drawImage(cur, 0, 0, t.width, t.height);
      cur = t;
    }
    return cur;
  }

  /* ---------- フォント読み込み待ち ---------- */
  const tried = new Set();
  function ensureFonts(texts) {
    const all = texts.join("") + "あ1AREA0123456789:";
    const f = fnt(20, 700);
    const key = f + all;
    if (tried.has(key)) return;
    let ok = true;
    try { ok = document.fonts.check(f, all); } catch (e) { ok = true; }
    if (!ok) {
      tried.add(key);
      Promise.all([document.fonts.load(f, all), document.fonts.load(fnt(20, 400), all)])
        .then(() => render()).catch(() => {});
    }
  }

  /* ---------- メイン描画 ---------- */
  function render(forExport) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    if (tplReady) ctx.drawImage(tpl, 0, 0, W, H);

    const name = $("circleName").value;
    const hn = $("hn").value;
    const cp = $("cp").value;
    const free = $("free").value;
    const otherText = $("otherText").value;
    ensureFonts([name, hn, cp, free, otherText]);

    // サークルカット
    if (img) drawCutContent(ctx, 0, 0);

    ctx.fillStyle = "#111";
    // サークル名 / HN
    fitText(name, NAME_BOX.x + NAME_BOX.w / 2, NAME_BOX.y + NAME_BOX.h / 2, NAME_BOX.w, 44, "center");
    fitText(hn, HN_BOX.x + HN_BOX.w / 2, HN_BOX.y + HN_BOX.h / 2, HN_BOX.w, 40, "center");
    // CP
    fitText(cp, CP_BOX.x, CP_BOX.y, CP_BOX.w, 26, "left");

    // スペース番号ラベル
    const area = $("area").value, kana = $("kana").value, num = $("num").value;
    if (kana && num) fitText(kana + num, SPACE_LABEL.x, SPACE_LABEL.y, SPACE_LABEL.w, 34, "left");

    // 滞在時刻
    if ($("stayOn").checked) {
      const hh = (a, b) => ($(a).value ? $(a).value + ":" + $(b).value : "");
      fitText(hh("sh", "sm"), STAY_START.x + STAY_START.w / 2, STAY_Y, STAY_START.w, 24, "center");
      fitText(hh("eh", "em"), STAY_END.x + STAY_END.w / 2, STAY_Y, STAY_END.w, 24, "center");
    }
    // その他テキスト
    if ($("otherOn").checked) fitText(otherText, OTHER_TEXT.x, OTHER_TEXT.y, OTHER_TEXT.w, 24, "left");

    // フリースペース
    drawFree(free);

    // 乗算の色重ね
    if ($("stayOn").checked) tint(R_STAY);
    if ($("absent").checked) tint(R_ABSENT);
    if ($("unknown").checked) tint(R_UNKNOWN);
    if ($("r18").value) tint(R_R18[$("r18").value]);
    if ($("shoot").value) tint(R_SHOOT[$("shoot").value]);
    if ($("spoil").value) tint(R_SPOIL[$("spoil").value]);
    document.querySelectorAll(".content:checked").forEach((c) => tint(R_CONTENT[c.value]));
    if (area) {
      tint([AREA_X[area] - 13, 573, 26, 34]);
      tint([FIELD_AREA_X[area] - 12, 1037, 24, 30]);
    }

    // 配置図
    if (kana && num) {
      const r = KANA.indexOf(kana), c = parseInt(num, 10) - 1;
      const x = MAP_COLS[c], y = MAP_ROWS[r];
      if (img) {
        const full = document.createElement("canvas");
        full.width = CUT.w; full.height = CUT.h;
        drawCutContent(full.getContext("2d"), CUT.x, CUT.y);
        const k = Math.min((CELL - 6) / CUT.w, (CELL - 6) / CUT.h);
        const tw = Math.round(CUT.w * k), th = Math.round(CUT.h * k);
        const small = downscale(full, tw, th);
        const tx = x + (CELL - tw) / 2, ty = y + (CELL - th) / 2;
        ctx.save();
        ctx.fillStyle = "#fff"; ctx.fillRect(x, y, CELL, CELL);
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(small, tx, ty, tw, th);
        ctx.strokeStyle = targetColor; ctx.lineWidth = 3;
        ctx.strokeRect(tx - 1.5, ty - 1.5, tw + 3, th + 3);
        ctx.restore();
      } else {
        tint([x, y, CELL, CELL]);
      }
    }

    // ハンドル（プレビューのみ）
    if (!forExport && img) drawHandles();
  }

  function drawFree(text) {
    if (!text) return;
    const size = parseInt($("fsize").value, 10);
    const lh = size * 1.5;
    ctx.save();
    ctx.beginPath(); ctx.rect(FREE_BOX.x - 8, FREE_BOX.y - 8, FREE_BOX.w + 16, FREE_BOX.h + 16); ctx.clip();
    ctx.fillStyle = $("fcolor").value;
    ctx.font = fnt(size, 400);
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    let y = FREE_BOX.y;
    text.split("\n").forEach((para) => {
      let line = "";
      if (para === "") { y += lh; return; }
      for (const ch of para) {
        if (ctx.measureText(line + ch).width > FREE_BOX.w && line) {
          ctx.fillText(line, FREE_BOX.x, y); y += lh; line = ch;
        } else line += ch;
      }
      ctx.fillText(line, FREE_BOX.x, y); y += lh;
    });
    ctx.restore();
  }

  /* ---------- ハンドル操作 ---------- */
  const HS = 34; // ハンドル描画サイズ
  function corners() {
    const w = img.naturalWidth * im.s / 2, h = img.naturalHeight * im.s / 2;
    return [[-1, -1], [1, -1], [-1, 1], [1, 1]].map((s) => ({ sx: s[0], sy: s[1], x: im.cx + s[0] * w, y: im.cy + s[1] * h }));
  }
  function drawHandles() {
    const w = img.naturalWidth * im.s, h = img.naturalHeight * im.s;
    ctx.save();
    ctx.strokeStyle = "#ff8a2b"; ctx.lineWidth = 3; ctx.setLineDash([12, 8]);
    ctx.strokeRect(im.cx - w / 2, im.cy - h / 2, w, h);
    ctx.setLineDash([]);
    corners().forEach((c) => {
      ctx.fillStyle = "#fff"; ctx.strokeStyle = "#ff8a2b"; ctx.lineWidth = 4;
      ctx.fillRect(c.x - HS / 2, c.y - HS / 2, HS, HS);
      ctx.strokeRect(c.x - HS / 2, c.y - HS / 2, HS, HS);
    });
    ctx.restore();
  }
  function toCanvas(clientX, clientY) {
    const r = cv.getBoundingClientRect();
    return { x: (clientX - r.left) * W / r.width, y: (clientY - r.top) * H / r.height };
  }
  function hitHandle(p) {
    if (!img) return null;
    return corners().find((c) => Math.abs(p.x - c.x) <= HS && Math.abs(p.y - c.y) <= HS) || null;
  }
  function hitBody(p) {
    if (!img) return false;
    const w = img.naturalWidth * im.s, h = img.naturalHeight * im.s;
    const inImg = p.x >= im.cx - w / 2 && p.x <= im.cx + w / 2 && p.y >= im.cy - h / 2 && p.y <= im.cy + h / 2;
    const inBox = p.x >= CUT.x && p.x <= CUT.x + CUT.w && p.y >= CUT.y && p.y <= CUT.y + CUT.h;
    return inImg && inBox;
  }

  let drag = null;
  cv.addEventListener("touchstart", (e) => {
    const t = e.touches[0]; if (!t) return;
    const p = toCanvas(t.clientX, t.clientY);
    if (hitHandle(p) || hitBody(p)) e.preventDefault();
  }, { passive: false });

  cv.addEventListener("pointerdown", (e) => {
    const p = toCanvas(e.clientX, e.clientY);
    const h = hitHandle(p);
    if (h) {
      drag = { type: "scale", sx: h.sx, sy: h.sy, ox: im.cx - h.sx * img.naturalWidth * im.s / 2, oy: im.cy - h.sy * img.naturalHeight * im.s / 2 };
    } else if (hitBody(p)) {
      drag = { type: "move", dx: im.cx - p.x, dy: im.cy - p.y };
    } else return;
    cv.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  cv.addEventListener("pointermove", (e) => {
    const p = toCanvas(e.clientX, e.clientY);
    if (!drag) {
      cv.style.cursor = hitHandle(p) ? "nwse-resize" : (hitBody(p) ? "move" : "default");
      return;
    }
    if (drag.type === "move") {
      im.cx = p.x + drag.dx; im.cy = p.y + drag.dy;
    } else {
      let ns = Math.max(Math.abs(p.x - drag.ox) / img.naturalWidth, Math.abs(p.y - drag.oy) / img.naturalHeight);
      ns = Math.max(0.02, ns);
      im.s = ns;
      im.cx = drag.ox + drag.sx * img.naturalWidth * ns / 2;
      im.cy = drag.oy + drag.sy * img.naturalHeight * ns / 2;
    }
    render();
  });
  const endDrag = () => { drag = null; };
  cv.addEventListener("pointerup", endDrag);
  cv.addEventListener("pointercancel", endDrag);

  /* ---------- イベント ---------- */
  document.querySelectorAll("input, select, textarea").forEach((el) => {
    if (el.id === "file") return;
    el.addEventListener("input", render);
    el.addEventListener("change", render);
  });
  $("kana").addEventListener("change", () => { rebuildNum(); render(); });
  document.querySelectorAll("input[name=col]").forEach((r) => r.addEventListener("change", () => {
    targetColor = document.querySelector("input[name=col]:checked").value; render();
  }));
  document.querySelectorAll("input[name=font]").forEach((r) => r.addEventListener("change", () => {
    const f = fnt(20, 700);
    Promise.all([document.fonts.load(f, "あ漢A1"), document.fonts.load(fnt(20, 400), "あ漢A1")]).then(render).catch(render);
    render();
  }));

  $("btnSave").addEventListener("click", () => {
    render(true);
    const url = cv.toDataURL("image/png");
    render(false);
    const a = document.createElement("a");
    a.href = url;
    a.download = (($("circleName").value || "お品書き").replace(/[\\/:*?"<>|]/g, "_")) + ".png";
    document.body.appendChild(a); a.click(); a.remove();
  });

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
  render();
})();
</script>
</body>
</html>
